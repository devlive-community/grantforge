# The sample notes application. Everything about GrantForge comes from the environment, as the samples' tests set it:
#   GRANTFORGE_URL                     GrantForge's address
#   NOTES_CLIENT_ID/NOTES_CLIENT_SECRET  its confidential client
server.port=${NOTES_PORT:19082}
spring.security.oauth2.client.registration.grantforge.client-id=${NOTES_CLIENT_ID:}
spring.security.oauth2.client.registration.grantforge.client-secret=${NOTES_CLIENT_SECRET:}
spring.security.oauth2.client.registration.grantforge.scope=openid,profile,permissions
spring.security.oauth2.client.registration.grantforge.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.grantforge.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.grantforge.issuer-uri=${GRANTFORGE_URL:http://127.0.0.1:19080}
spring.security.oauth2.client.provider.grantforge.user-name-attribute=preferred_username
grantforge.client.base-url=${GRANTFORGE_URL:http://127.0.0.1:19080}
grantforge.client.cache-ttl=0s
