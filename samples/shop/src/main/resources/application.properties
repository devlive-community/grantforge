# The sample shop. Everything about GrantForge comes from the environment, as the samples' tests set it:
#   GRANTFORGE_URL           GrantForge's address
#   SHOP_BROWSER_CLIENT_ID   the public client the browser signs in with
#   SHOP_CLIENT_ID/SECRET    the shop's confidential client, which declares the order entity at start-up
#   SHOP_SDK_DIRECTORY       the built @grantforge/client (sdk/grantforge-js/dist)
server.port=${SHOP_PORT:19081}
spring.datasource.url=jdbc:h2:mem:shop
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
grantforge.client.base-url=${GRANTFORGE_URL:http://127.0.0.1:19080}
grantforge.client.client-id=${SHOP_CLIENT_ID:}
grantforge.client.client-secret=${SHOP_CLIENT_SECRET:}
# Revalidate every request, so the samples' tests see permission changes at once; applications keep the default.
grantforge.client.cache-ttl=0s
shop.issuer=${GRANTFORGE_URL:http://127.0.0.1:19080}
shop.browser-client-id=${SHOP_BROWSER_CLIENT_ID:}
shop.sdk-directory=${SHOP_SDK_DIRECTORY:../../sdk/grantforge-js/dist}
