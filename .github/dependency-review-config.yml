# Used by actions/dependency-review-action on pull requests (.github/workflows/security.yml).
fail-on-severity: moderate
fail-on-scopes:
  - runtime
  - development
# Licenses compatible with distributing GrantForge under MIT. Weak copyleft licenses
# (EPL, MPL, LGPL) are accepted only for unmodified third-party libraries.
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - CC0-1.0
  - CC-BY-4.0
  - Unlicense
  - BlueOak-1.0.0
  - Python-2.0
  - EPL-1.0
  - EPL-2.0
  - MPL-2.0
  - LGPL-2.1-only
  - LGPL-2.1-or-later
# Reviewed exceptions: Oracle JDBC is redistributable under the Oracle Free Use Terms (no SPDX id);
# MySQL Connector/J (GPL-2.0 with the Universal FOSS Exception) is a test-only dependency, never shipped.
allow-dependencies-licenses:
  - pkg:maven/com.oracle.database.jdbc/ojdbc11
  - pkg:maven/com.oracle.database.jdbc/ucp11
  - pkg:maven/com.mysql/mysql-connector-j
  # Documentation site only (docs/), both permissive: robust-predicates is Unlicense and public domain, uri-js
  # BSD-2-Clause together with the equally permissive BSD-2-Clause-Views.
  - pkg:npm/robust-predicates
  - pkg:npm/uri-js
  # The Bouncy Castle Licence is the MIT license under its own name, which the review does not recognise.
  - pkg:maven/org.bouncycastle/bcprov-jdk18on
  # Hadoop's relocated protobuf for the HDFS agent: Apache-2.0, BSD-3-Clause, MIT and protobuf's BSD-style licence.
  - pkg:maven/org.apache.hadoop.thirdparty/hadoop-shaded-protobuf_3_25
  # A build plugin that writes the release's Javadoc jars, never shipped: Apache-2.0 with BSD, MIT and public domain parts.
  - pkg:maven/org.apache.maven.plugins/maven-javadoc-plugin
comment-summary-in-pr: on-failure
