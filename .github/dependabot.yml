version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /core/grantforge-web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
