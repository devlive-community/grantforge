version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    # Each HDFS adapter targets a specific Hadoop major/minor ABI.
    # Keep patch updates automatic; review new version lines with their own adapters.
    ignore:
      - dependency-name: 'org.apache.hadoop:*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: npm
    directory: /core/grantforge-web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
