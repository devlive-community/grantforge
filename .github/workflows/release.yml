name: Release

# A release is a pushed tag v<version>, which script/release/tag.sh makes (D-83, D-90): script/ci/release.sh builds the
# distribution, its SBOM and checksums and writes the notes from the commits since the previous release; this
# workflow then publishes the image to GHCR, the Maven artifacts to GitHub Packages and, when the CENTRAL_USERNAME,
# CENTRAL_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE secrets are set, to Maven Central, the @grantforge/client
# package to npm through trusted publishing (OIDC, no npm token), and last the GitHub release.
# Versions with -rc.N are pre-releases and do not move the image's latest tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      # npm trusted publishing verifies an OIDC token minted per job run.
      id-token: write
    env:
      CENTRAL_CONFIGURED: ${{ secrets.CENTRAL_USERNAME != '' && secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The notes list the commits since the previous release tag.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            core/grantforge-web/pnpm-lock.yaml
            sdk/grantforge-js/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - name: Build the distribution, SBOM, checksums and notes
        id: build
        env:
          # CI verified the tag in its own run; the release build packages without repeating it.
          GRANTFORGE_RELEASE_SKIP_TESTS: '1'
        run: |
          bash script/ci/release.sh "${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-rc.* ]]; then echo "prerelease=true" >> "${GITHUB_OUTPUT}"; else echo "prerelease=false" >> "${GITHUB_OUTPUT}"; fi
      - name: Install JavaScript SDK dependencies
        run: bash script/ci/sdk_js.sh install
      - name: Build, lint and test the JavaScript SDK
        run: |
          bash script/ci/sdk_js.sh build
          bash script/ci/sdk_js.sh lint
          bash script/ci/sdk_js.sh test
      - name: Publish the JavaScript SDK to npm
        env:
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
          VERSION: ${{ steps.build.outputs.version }}
        working-directory: sdk/grantforge-js
        run: |
          if [[ -n "$(npm view "@grantforge/client@${VERSION}" version 2>/dev/null)" ]]; then
            echo "::notice::@grantforge/client ${VERSION} is on npm already"
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1+; the Node 22 image ships an older CLI.
          npm install -g npm@^11.5.1
          npm_tag=latest
          if [[ "${PRERELEASE}" == "true" ]]; then npm_tag=next; fi
          npm publish --access public --tag "${npm_tag}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          tags=(--tag "${IMAGE}:${VERSION}")
          if [[ "${PRERELEASE}" == "false" ]]; then tags+=(--tag "${IMAGE}:latest"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --push "${tags[@]}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --build-arg "RELEASE=grantforge-${VERSION}.tar.gz" \
            -f deploy/docker/Dockerfile target/release
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish the Maven artifacts to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          # A version on GitHub Packages cannot be uploaded again (the deploy returns 409), so
          # skip when the version of the parent pom is there already, as after a re-run.
          if gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/maven/org.devlive.grantforge.grantforge/versions" \
              --jq '.[].name' 2>/dev/null | grep -qx "${VERSION}" \
            || gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/org.devlive.grantforge.grantforge/versions" \
              --jq '.[].name' 2>/dev/null | grep -qx "${VERSION}"; then
            echo "::notice::${VERSION} is in GitHub Packages already"
            exit 0
          fi
          # Same skip flags and parallel reactor as the distribution build: CI verified this tag,
          # the deploy only rebuilds and uploads, and deployAtEnd uploads only after every module
          # built, so a failed deploy leaves no partial version behind.
          # maven.test.skip also skips compiling test classes; -DskipTests alone still let the
          # HDFS agent modules run their failsafe integration tests here and time out the fork.
          ./mvnw --batch-mode --no-transfer-progress -T 1C -Prelease -Dgpg.skip -Dmaven.test.skip=true -DskipITs -DskipFrontend \
            -Djacoco.skip=true -Denforcer.skip=true "-P!null-safety" -DdeployAtEnd=true deploy \
            "-DaltDeploymentRepository=github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
      - uses: actions/setup-java@v6
        if: env.CENTRAL_CONFIGURED == 'true'
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish the Maven artifacts to Maven Central
        if: env.CENTRAL_CONFIGURED == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress -T 1C -Prelease,central -Dcentral.skip=false -Dmaven.test.skip=true -DskipITs -DskipFrontend \
            -Djacoco.skip=true -Denforcer.skip=true "-P!null-safety" deploy
      - name: Skip Maven Central
        if: env.CENTRAL_CONFIGURED != 'true'
        run: echo "::notice::Maven Central skipped; set CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE to publish there"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "GrantForge ${VERSION}" \
            --notes-file target/release/notes.md "${flags[@]}" \
            "target/release/grantforge-${VERSION}.tar.gz" "target/release/grantforge-${VERSION}.sbom.json" \
            target/release/SHA256SUMS
