name: Release

# A release is a pushed tag v<version>, which script/release/tag.sh makes (D-83, D-90). The tag gets a complete CI run
# of its own (ci.yml); this workflow waits for it instead of testing again. script/ci/release.sh then builds the
# distribution, its SBOM and checksums and writes the notes from the commits since the previous release.
#
# Publishing goes from what can be replaced to what cannot: the Maven artifacts to GitHub Packages and the image to
# GHCR, then the Maven artifacts to Maven Central when the CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY and
# GPG_PASSPHRASE secrets are set, the @grantforge/client package to npm, and last the GitHub release, which marks the
# release done. Every step skips what is published already, so a release that failed half-way is finished by running
# the workflow again. The @grantforge/client package publishes to npm through trusted publishing (OIDC), which needs
# no npm token. Versions with -rc.N are pre-releases and do not move the image's latest tag. Only the upstream
# repository releases: a tag pushed to a fork publishes nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Build and publish the release
    if: github.repository_owner == 'devlive-community'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
      packages: write
      # npm trusted publishing verifies an OIDC token minted per job run.
      id-token: write
    env:
      CENTRAL_CONFIGURED: ${{ secrets.CENTRAL_USERNAME != '' && secrets.GPG_PRIVATE_KEY != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes list the commits since the previous release tag.
          fetch-depth: 0
      - name: Wait for the CI run of the tag to pass
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --branch "${GITHUB_REF_NAME}" \
              --event push --commit "${GITHUB_SHA}" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "${run_id}" ]] && break
            sleep 20
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::CI did not start for ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 60 > /dev/null; then
            echo "::error::CI run ${run_id} of ${GITHUB_REF_NAME} did not pass; fix it, or re-run it and then this workflow"
            exit 1
          fi
          echo "CI run ${run_id} passed for ${GITHUB_REF_NAME}"
      # JDK 25 builds every module, the Trino agents among them; the others still target their own Java release.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 8.10.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            core/grantforge-web/pnpm-lock.yaml
            sdk/grantforge-js/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - name: Build the distribution, SBOM, checksums and notes
        id: build
        env:
          GRANTFORGE_RELEASE_SKIP_TESTS: '1'
        run: |
          bash script/ci/release.sh "${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-rc.* ]]; then echo "prerelease=true" >> "${GITHUB_OUTPUT}"; else echo "prerelease=false" >> "${GITHUB_OUTPUT}"; fi
      # CI linted and tested the SDK on the tag; it only needs building for npm.
      - name: Build the JavaScript SDK
        run: |
          bash script/ci/sdk_js.sh install
          bash script/ci/sdk_js.sh build

      # Replaceable: a version in GitHub Packages can be deleted, an image tag pushed again.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish the Maven artifacts to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/maven/org.devlive.grantforge.grantforge/versions" \
              --jq '.[].name' 2>/dev/null | grep -qx "${VERSION}" \
            || gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/org.devlive.grantforge.grantforge/versions" \
              --jq '.[].name' 2>/dev/null | grep -qx "${VERSION}"; then
            echo "::notice::${VERSION} is in GitHub Packages already"
            exit 0
          fi
          # The console was built into the distribution above; the deploys reuse it and skip the checks CI ran.
          # Nothing is uploaded until every module is built, so a failed build leaves no version behind.
          # maven.test.skip also skips compiling test classes; -DskipTests alone still let the
          # HDFS agent modules run their failsafe integration tests here and time out the fork.
          ./mvnw --batch-mode --no-transfer-progress -T 1C -Prelease -Dgpg.skip -Dmaven.test.skip=true -DskipITs -DskipFrontend \
            -Djacoco.skip=true -Denforcer.skip=true "-P!null-safety" -DdeployAtEnd=true deploy \
            "-DaltDeploymentRepository=github::https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          tags=(--tag "${IMAGE}:${VERSION}")
          if [[ "${PRERELEASE}" == "false" ]]; then tags+=(--tag "${IMAGE}:latest"); fi
          docker buildx build --platform linux/amd64,linux/arm64 --push "${tags[@]}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --build-arg "RELEASE=grantforge-${VERSION}.tar.gz" \
            -f deploy/docker/Dockerfile target/release

      # Permanent: a version on Maven Central or npm can never be published again, so these come last.
      - uses: actions/setup-java@v6
        if: env.CENTRAL_CONFIGURED == 'true'
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish the Maven artifacts to Maven Central
        if: env.CENTRAL_CONFIGURED == 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if curl --silent --fail --head --output /dev/null \
              "https://repo1.maven.org/maven2/org/devlive/grantforge/grantforge/${VERSION}/grantforge-${VERSION}.pom"; then
            echo "::notice::${VERSION} is on Maven Central already"
            exit 0
          fi
          ./mvnw --batch-mode --no-transfer-progress -T 1C -Prelease,central -Dcentral.skip=false -Dmaven.test.skip=true -DskipITs -DskipFrontend \
            -Djacoco.skip=true -Denforcer.skip=true "-P!null-safety" deploy
      - name: Skip Maven Central
        if: env.CENTRAL_CONFIGURED != 'true'
        run: echo "::notice::Maven Central skipped; set CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE to publish there"
      - name: Publish the JavaScript SDK to npm
        env:
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
          VERSION: ${{ steps.build.outputs.version }}
        working-directory: sdk/grantforge-js
        run: |
          if [[ -n "$(npm view "@grantforge/client@${VERSION}" version 2>/dev/null)" ]]; then
            echo "::notice::@grantforge/client ${VERSION} is on npm already"
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1+; the Node 22 image ships an older CLI.
          npm install -g npm@^11.5.1
          npm_tag=latest
          if [[ "${PRERELEASE}" == "true" ]]; then npm_tag=next; fi
          npm publish --access public --tag "${npm_tag}"

      # Last: the GitHub release says the release is complete.
      - name: Publish the GitHub release
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
        run: |
          assets=("target/release/grantforge-${VERSION}.tar.gz" "target/release/grantforge-${VERSION}.sbom.json"
                  target/release/SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${assets[@]}"
            exit 0
          fi
          flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "v${VERSION}" \
            --notes-file target/release/notes.md "${flags[@]}" "${assets[@]}"
