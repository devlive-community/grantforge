name: Publish docs

# The documentation site (docs/) is a static Next.js export, published to GitHub Pages from the default branch.
on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'core/grantforge-web/src/api/openapi.json'
      - 'core/**/src/main/java/**/*ErrorCode.java'
      - 'core/**/src/main/resources/i18n/*.properties'
      - 'script/ci/docs.sh'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.10.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install locked dependencies
        run: bash script/ci/docs.sh install
      - name: Check
        run: bash script/ci/docs.sh check
      - name: Build
        run: bash script/ci/docs.sh build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
