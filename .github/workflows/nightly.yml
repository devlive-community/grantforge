name: Nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark scale: full (a million accounts, thresholds enforced) or smoke'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

# A manual run waits for a scheduled one rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What changed on dev in the last day (script/ci/changed_areas.py): a quiet day runs nothing. Sundays and manual
  # runs check everything, so drift in the images and dependencies the tests pull still shows within a week.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hdfs: ${{ steps.areas.outputs.hdfs }}
      zookeeper: ${{ steps.areas.outputs.zookeeper }}
      mysql: ${{ steps.areas.outputs.mysql }}
      hive: ${{ steps.areas.outputs.hive }}
      performance: ${{ steps.areas.outputs.performance }}
      docker: ${{ steps.areas.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Decide the areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "${EVENT}" != "schedule" || "$(date -u +%u)" == "7" ]]; then
            python3 script/ci/changed_areas.py --all --output "${GITHUB_OUTPUT}"
          else
            python3 script/ci/changed_areas.py --since "25 hours ago" --output "${GITHUB_OUTPUT}"
          fi

  hdfs-integration:
    name: HDFS ${{ matrix.hadoop }} Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.hdfs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        hadoop: ['2.7', '2.10', '3.2', '3.3', '3.4', '3.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the release agent in real Hadoop containers
        run: bash script/ci/hdfs_integration.sh "${{ matrix.hadoop }}"
      - name: Upload HDFS reports and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hdfs-${{ matrix.hadoop }}-testcontainers-java-${{ matrix.java }}
          path: |
            agents/grantforge-agent-hdfs-${{ matrix.hadoop }}/target/failsafe-reports
            agents/grantforge-agent-hdfs-${{ matrix.hadoop }}/target/hdfs-testcontainers
            plugins/grantforge-plugin-hdfs/target/failsafe-reports
            plugins/grantforge-plugin-hdfs/target/hdfs-testcontainers
          if-no-files-found: warn
          retention-days: 14

  zookeeper-integration:
    name: ZooKeeper Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.zookeeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify ZooKeeper TLS, ACLs and ensemble failover
        run: bash script/ci/zookeeper_integration.sh
      - name: Upload ZooKeeper reports and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zookeeper-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-zookeeper/target/failsafe-reports
            plugins/grantforge-plugin-zookeeper/target/zookeeper-testcontainers
          if-no-files-found: warn
          retention-days: 14

  mysql-integration:
    name: MySQL Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the MySQL plugin and proxy agent on MySQL 8.0 and 8.4
        run: bash script/ci/mysql_integration.sh
      - name: Upload MySQL reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-mysql/target/failsafe-reports
            agents/grantforge-agent-mysql/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  hive-integration:
    name: Hive Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.hive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the Hive plugin and agent on HiveServer2 3.1, 4.0 and 4.1
        run: bash script/ci/hive_integration.sh
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-hive/target/grantforge-agent-hive-${version}.jar"
      - name: Upload Hive reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hive-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-hive/target/failsafe-reports
            agents/grantforge-agent-hive/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  zookeeper-agent:
    name: ZooKeeper agent ${{ matrix.zookeeper }} (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.zookeeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        zookeeper: ['3.6.4', '3.7.2', '3.8.5', '3.9.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Only the agent's own tests, against each ZooKeeper line; CI ran those of the modules it builds on.
      - name: Test the SASL provider against the real server API
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -DskipFrontend
          -Dzookeeper.agent.version=${{ matrix.zookeeper }}
          -Dtest='org/devlive/grantforge/zookeeper/agent/**' -Dsurefire.failIfNoSpecifiedTests=false
          -Djacoco.skip=true -Denforcer.skip=true
          -pl agents/grantforge-agent-zookeeper -am verify
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-zookeeper/target/grantforge-agent-zookeeper-${version}.jar"
      - name: Upload agent test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zookeeper-agent-${{ matrix.zookeeper }}-java-${{ matrix.java }}
          path: agents/grantforge-agent-zookeeper/target/surefire-reports
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Performance benchmarks (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRANTFORGE_CHECKED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Seed at scale, measure and check the thresholds
        run: bash script/ci/perf_benchmark.sh "${{ inputs.mode || 'full' }}" postgres:17
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: perf/target/perf-report.json
          if-no-files-found: warn
          retention-days: 30

  # One build of the distribution for every database of the smoke test.
  distribution:
    name: Distribution for the image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTFORGE_CHECKED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 8.10.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Package the distribution
        run: |
          # shellcheck source=script/ci/maven.sh
          source script/ci/maven.sh
          "${MVN[@]}" -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
          retention-days: 1

  docker-smoke:
    name: Image and compose example (${{ matrix.database }})
    needs: [changes, distribution]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTFORGE_SMOKE_SKIP_BUILD: '1'
    strategy:
      fail-fast: false
      matrix:
        database: [h2, postgres, mariadb, mysql, sqlserver, oracle]
    steps:
      - uses: actions/checkout@v7
      # Maven only resolves the MySQL driver here; the build is the distribution job's.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/
      - name: Build the image, start it with the database and sign in across a restart
        run: bash script/ci/docker_smoke.sh "${{ matrix.database }}"
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-${{ matrix.database }}
          path: target/docker-smoke/server.log
          if-no-files-found: warn
          retention-days: 14
