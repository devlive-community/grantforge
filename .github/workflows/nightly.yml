name: Nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark scale: full (a million accounts, thresholds enforced) or smoke'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

# A manual run waits for a scheduled one rather than cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What changed on dev in the last day (script/ci/changed_areas.py): a quiet day runs nothing. Sundays and manual
  # runs check everything, so drift in the images and dependencies the tests pull still shows within a week.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hdfs: ${{ steps.areas.outputs.hdfs }}
      zookeeper: ${{ steps.areas.outputs.zookeeper }}
      mysql: ${{ steps.areas.outputs.mysql }}
      hive: ${{ steps.areas.outputs.hive }}
      kafka: ${{ steps.areas.outputs.kafka }}
      hbase: ${{ steps.areas.outputs.hbase }}
      trino: ${{ steps.areas.outputs.trino }}
      yarn: ${{ steps.areas.outputs.yarn }}
      pulsar: ${{ steps.areas.outputs.pulsar }}
      solr: ${{ steps.areas.outputs.solr }}
      performance: ${{ steps.areas.outputs.performance }}
      docker: ${{ steps.areas.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decide the areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "${EVENT}" != "schedule" || "$(date -u +%u)" == "7" ]]; then
            python3 script/ci/changed_areas.py --all --output "${GITHUB_OUTPUT}"
          else
            python3 script/ci/changed_areas.py --since "25 hours ago" --output "${GITHUB_OUTPUT}"
          fi

  hdfs-integration:
    name: HDFS ${{ matrix.hadoop }} Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.hdfs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        hadoop: ['2.7', '2.10', '3.2', '3.3', '3.4', '3.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the release agent in real Hadoop containers
        run: bash script/ci/hdfs_integration.sh "${{ matrix.hadoop }}"
      - name: Upload HDFS reports and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hdfs-${{ matrix.hadoop }}-testcontainers-java-${{ matrix.java }}
          path: |
            agents/grantforge-agent-hdfs-${{ matrix.hadoop }}/target/failsafe-reports
            agents/grantforge-agent-hdfs-${{ matrix.hadoop }}/target/hdfs-testcontainers
            plugins/grantforge-plugin-hdfs/target/failsafe-reports
            plugins/grantforge-plugin-hdfs/target/hdfs-testcontainers
          if-no-files-found: warn
          retention-days: 14

  zookeeper-integration:
    name: ZooKeeper Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.zookeeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify ZooKeeper TLS, ACLs and ensemble failover
        run: bash script/ci/zookeeper_integration.sh
      - name: Upload ZooKeeper reports and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zookeeper-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-zookeeper/target/failsafe-reports
            plugins/grantforge-plugin-zookeeper/target/zookeeper-testcontainers
          if-no-files-found: warn
          retention-days: 14

  mysql-integration:
    name: MySQL Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.mysql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the MySQL plugin and proxy agent on MySQL 8.0 and 8.4
        run: bash script/ci/mysql_integration.sh
      - name: Upload MySQL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-mysql/target/failsafe-reports
            agents/grantforge-agent-mysql/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  hive-integration:
    name: Hive Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.hive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the Hive plugin and agent on HiveServer2 3.1, 4.0 and 4.1
        run: bash script/ci/hive_integration.sh
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-hive/target/grantforge-agent-hive-${version}.jar"
      - name: Upload Hive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-hive/target/failsafe-reports
            agents/grantforge-agent-hive/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  kafka-integration:
    name: Kafka Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.kafka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the Kafka plugin and agent on Kafka 3.7, 3.9, 4.1 and 4.3
        run: bash script/ci/kafka_integration.sh
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-kafka/target/grantforge-agent-kafka-${version}.jar"
      - name: Upload Kafka reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-kafka/target/failsafe-reports
            agents/grantforge-agent-kafka/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  hbase-integration:
    name: HBase Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.hbase == 'true'
    runs-on: ubuntu-latest
    # The first run per release downloads and verifies a 370 MB Apache distribution into its test image.
    timeout-minutes: 60
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the HBase plugin and agent on HBase 2.5, 2.6 and 3.0
        run: bash script/ci/hbase_integration.sh
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-hbase/target/grantforge-agent-hbase-${version}.jar"
      # The agent compiles against HBase 2.5; this proves every hook it overrides exists in HBase 3.0 too.
      - name: Compile the agent against HBase 3.0
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -DskipFrontend -DskipTests -Djacoco.skip=true
          -Phbase-3 -pl agents/grantforge-agent-hbase -am compile
      - name: Upload HBase reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbase-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-hbase/target/failsafe-reports
            agents/grantforge-agent-hbase/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  # Java 25 builds the Trino agents too, and verifies their jars in the same releases.
  trino-integration:
    name: Trino Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.trino == 'true'
    runs-on: ubuntu-latest
    # Four Trino images of about 2.4 GB each are pulled on a cold runner.
    timeout-minutes: 60
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the Trino plugin and agents on Trino 470, 476, 479 and 484
        run: bash script/ci/trino_integration.sh
      - name: Upload Trino reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trino-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-trino/target/failsafe-reports
            agents/grantforge-agent-trino-470/target/failsafe-reports
            agents/grantforge-agent-trino-479/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  yarn-integration:
    name: YARN Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.yarn == 'true'
    runs-on: ubuntu-latest
    # The first run builds the Hadoop 3.2.4 image from a 700 MB Apache distribution and pulls three Apache images.
    timeout-minutes: 60
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the YARN plugin and agent on Hadoop 3.2.4, 3.3.6, 3.4.3 and 3.5.0
        run: bash script/ci/yarn_integration.sh
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-yarn/target/grantforge-agent-yarn-${version}.jar"
      - name: Upload YARN reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarn-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-yarn/target/failsafe-reports
            agents/grantforge-agent-yarn/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  pulsar-integration:
    name: Pulsar Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.pulsar == 'true'
    runs-on: ubuntu-latest
    # Pulls the images of four Pulsar releases and starts a standalone broker for each suite.
    timeout-minutes: 60
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the Pulsar plugin and agent on Pulsar 3.0.17, 3.3.9, 4.0.14 and 4.2.5
        run: bash script/ci/pulsar_integration.sh
      - name: Check the shaded agent JAR's Java 17 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 61 \
            --jar "agents/grantforge-agent-pulsar/target/grantforge-agent-pulsar-${version}.jar"
      - name: Upload Pulsar reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-pulsar/target/failsafe-reports
            agents/grantforge-agent-pulsar/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  solr-integration:
    name: Solr Testcontainers (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.solr == 'true'
    runs-on: ubuntu-latest
    # Pulls the images of four Solr releases and starts a SolrCloud node for each suite.
    timeout-minutes: 60
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify the Solr plugin and agent on Solr 9.4.1, 9.8.1, 9.11.0 and 10.0.0
        run: bash script/ci/solr_integration.sh
      - name: Check the shaded agent JAR's Java 11 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 55 \
            --jar "agents/grantforge-agent-solr/target/grantforge-agent-solr-${version}.jar"
      - name: Upload Solr reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solr-testcontainers-java-${{ matrix.java }}
          path: |
            plugins/grantforge-plugin-solr/target/failsafe-reports
            agents/grantforge-agent-solr/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  zookeeper-agent:
    name: ZooKeeper agent ${{ matrix.zookeeper }} (Java ${{ matrix.java }})
    needs: changes
    if: needs.changes.outputs.zookeeper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        zookeeper: ['3.6.4', '3.7.2', '3.8.5', '3.9.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Only the agent's own unit tests; Failsafe runs the JAR integration test after package.
      - name: Test the SASL provider against the real server API
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -DskipFrontend
          -Dzookeeper.agent.version=${{ matrix.zookeeper }}
          -Dtest='org.devlive.grantforge.zookeeper.agent.*Test' -Dsurefire.failIfNoSpecifiedTests=false
          -Djacoco.skip=true -Denforcer.skip=true
          -pl agents/grantforge-agent-zookeeper -am verify
      - name: Verify both test phases ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          target = Path('agents/grantforge-agent-zookeeper/target')
          for phase, suffix in [('surefire', 'Test'), ('failsafe', 'IT')]:
              reports = (target / f'{phase}-reports').glob(f'TEST-*{suffix}.xml')
              suites = [ET.parse(report).getroot() for report in reports]
              executed = sum(int(suite.get('tests', 0)) - int(suite.get('skipped', 0)) for suite in suites)
              if executed == 0:
                  raise SystemExit(f'{phase}: no tests executed')
              print(f'{phase}: {executed} tests executed')
          PY
      - name: Check the shaded agent JAR's Java 8 bytecode
        run: |
          version="$(python3 script/ci/check_versions.py --show)"
          python3 script/ci/check_java_bytecode.py --max-major 52 \
            --jar "agents/grantforge-agent-zookeeper/target/grantforge-agent-zookeeper-${version}.jar"
      - name: Upload agent test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zookeeper-agent-${{ matrix.zookeeper }}-java-${{ matrix.java }}
          path: |
            agents/grantforge-agent-zookeeper/target/surefire-reports
            agents/grantforge-agent-zookeeper/target/failsafe-reports
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: Performance benchmarks (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRANTFORGE_CHECKED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Seed at scale, measure and check the thresholds
        run: bash script/ci/perf_benchmark.sh "${{ inputs.mode || 'full' }}" postgres:17
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: perf/target/perf-report.json
          if-no-files-found: warn
          retention-days: 30

  # One build of the distribution for every database of the smoke test.
  distribution:
    name: Distribution for the image
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTFORGE_CHECKED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Package the distribution
        run: |
          # shellcheck source=script/ci/maven.sh
          source script/ci/maven.sh
          "${MVN[@]}" -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
          retention-days: 1

  docker-smoke:
    name: Image and compose example (${{ matrix.database }})
    needs: [changes, distribution]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTFORGE_SMOKE_SKIP_BUILD: '1'
    strategy:
      fail-fast: false
      matrix:
        database: [h2, postgres, mariadb, mysql, sqlserver, oracle]
    steps:
      - uses: actions/checkout@v6
      # Maven only resolves the MySQL driver here; the build is the distribution job's.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - name: Build the image, start it with the database and sign in across a restart
        run: bash script/ci/docker_smoke.sh "${{ matrix.database }}"
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-${{ matrix.database }}
          path: target/docker-smoke/server.log
          if-no-files-found: warn
          retention-days: 14
