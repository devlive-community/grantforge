name: Nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark scale: full (a million accounts, thresholds enforced) or smoke'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Performance benchmarks (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Seed at scale, measure and check the thresholds
        run: bash script/ci/perf_benchmark.sh "${{ inputs.mode || 'full' }}" postgres:17
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: perf/target/perf-report.json
          if-no-files-found: warn
          retention-days: 30

  docker-smoke:
    name: Image and compose example (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [h2, postgres, mariadb, mysql, sqlserver, oracle]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 8.10.2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Build the image, start it with the database and sign in across a restart
        run: bash script/ci/docker_smoke.sh "${{ matrix.database }}"
      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-${{ matrix.database }}
          path: target/docker-smoke/server.log
          if-no-files-found: warn
          retention-days: 14
