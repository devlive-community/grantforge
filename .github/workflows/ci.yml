name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      java_versions:
        description: 'JDK matrix as a JSON array (Java 17 or newer)'
        required: false
        default: '["17", "21", "25", "latest"]'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: License headers
        run: python3 script/ci/check_license_headers.py
      - name: Forbidden paths
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_forbidden_paths.py
      - name: Unit test mapping
        if: ${{ !cancelled() }}
        # The web console is report-only until its existing files get unit tests (task M1-08).
        run: python3 script/ci/check_test_mapping.py --report-only core/grantforge-web/
      - name: Text file format
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_file_format.py
      - name: Lint shell, Python and workflows
        if: ${{ !cancelled() }}
        run: python3 script/ci/lint_scripts.py

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Conventional commit messages
        run: python3 script/ci/check_commit_messages.py --base "${{ github.event.pull_request.base.sha || github.event.before }}" --head "${{ github.event.pull_request.head.sha || github.sha }}"

  ci-scripts:
    name: CI script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run CI script tests
        run: bash script/ci/test_ci_scripts.sh

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java_versions || '["17", "21", "25", "latest"]') }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test all Java modules
        run: bash script/ci/java.sh test
      - name: Check Java 17 bytecode compatibility
        run: python3 script/ci/check_java_bytecode.py --max-major 61
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-tests-${{ matrix.java }}
          path: core/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  java-quality:
    name: Java static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile all Java modules
        id: compile
        run: bash script/ci/java.sh compile-tests
      - name: Checkstyle
        run: bash script/ci/java.sh checkstyle
      - name: SpotBugs
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: bash script/ci/java.sh spotbugs
      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-static-analysis
          path: |
            core/**/target/checkstyle-result.xml
            core/**/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend type, build and lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Install locked dependencies
        id: install
        run: bash script/ci/web.sh install
      - name: Type check and build
        id: build
        run: bash script/ci/web.sh build
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/web.sh lint

      - name: Frontend contract tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/web.sh test
      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash script/ci/web.sh e2e-browsers
      - name: Browser acceptance tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash script/ci/web.sh e2e
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-tests
          path: |
            core/grantforge-web/playwright-report/
            core/grantforge-web/test-results/
          if-no-files-found: warn
          retention-days: 14

