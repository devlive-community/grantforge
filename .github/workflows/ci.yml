name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      java_versions:
        description: 'JDK matrix as a JSON array (Java 8 or newer)'
        required: false
        default: '["8", "11", "17", "21", "25", "latest"]'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scripts:
    name: CI script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run CI script tests
        run: bash script/ci/test_ci_scripts.sh

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java_versions || '["8", "11", "17", "21", "25", "latest"]') }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test all Java modules
        run: ./mvnw --batch-mode --no-transfer-progress -DskipFrontend clean test
      - name: Check Java 8 bytecode compatibility
        run: python3 configure/ci/check-java-bytecode.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-tests-${{ matrix.java }}
          path: core/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  java-quality:
    name: Java static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile all Java modules
        id: compile
        run: ./mvnw --batch-mode --no-transfer-progress -DskipFrontend test
      - name: Checkstyle
        run: ./mvnw --batch-mode --no-transfer-progress -DskipFrontend checkstyle:check
      - name: SpotBugs
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: ./mvnw --batch-mode --no-transfer-progress -DskipFrontend -Pstatic-analysis test spotbugs:check
      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-static-analysis
          path: |
            core/**/target/checkstyle-result.xml
            core/**/target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend type, build and lint checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/grantforge-web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Type check and build
        id: build
        run: pnpm build
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Frontend contract tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-tests
          path: |
            core/grantforge-web/playwright-report/
            core/grantforge-web/test-results/
          if-no-files-found: warn
          retention-days: 14

  database:
    name: MySQL ${{ matrix.mysql }} migrations / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
        java: ['8', '21', 'latest']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: grantforge-ci-test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: grantforge_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=grantforge-ci-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test schema initialization and upgrades
        env:
          GRANTFORGE_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/grantforge_ci?allowPublicKeyRetrieval=true&useSSL=false
          GRANTFORGE_TEST_DB_USER: root
          GRANTFORGE_TEST_DB_PASSWORD: grantforge-ci-test
        run: ./mvnw --batch-mode --no-transfer-progress -DskipFrontend -Pdatabase-integration -pl core/grantforge-service -am verify
      - name: Upload database test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-tests-mysql-${{ matrix.mysql }}-java-${{ matrix.java }}
          path: core/**/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14
