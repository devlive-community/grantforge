name: CI

# Pushes to dev and pull requests, so a branch with a pull request is checked once; and release tags, which get a
# complete run of their own that release.yml waits for (no later push to dev can cancel it).
on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      java_versions:
        description: 'JDKs besides 21 as a JSON array (Java 17 or newer); the Java 21 job always runs'
        required: false
        default: '["17", "25", "latest"]'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which areas the change touches (script/ci/changed_areas.py); every job below runs only for its own.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      java: ${{ steps.areas.outputs.java }}
      web: ${{ steps.areas.outputs.web }}
      sdk_js: ${{ steps.areas.outputs.sdk_js }}
      docs: ${{ steps.areas.outputs.docs }}
      database: ${{ steps.areas.outputs.database }}
      plugin_api: ${{ steps.areas.outputs.plugin_api }}
      fullstack: ${{ steps.areas.outputs.fullstack }}
      ci_scripts: ${{ steps.areas.outputs.ci_scripts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decide the areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FALLBACK: origin/${{ github.event.repository.default_branch }}
        run: |
          if [[ "${EVENT}" == "workflow_dispatch" || "${GITHUB_REF}" == refs/tags/* ]]; then
            python3 script/ci/changed_areas.py --all --output "${GITHUB_OUTPUT}"
          else
            python3 script/ci/changed_areas.py --base "${BASE}" --head "${HEAD}" --fallback "${FALLBACK}" \
              --output "${GITHUB_OUTPUT}"
          fi

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: License headers
        run: python3 script/ci/check_license_headers.py
      - name: Forbidden paths
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_forbidden_paths.py
      - name: One version everywhere
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_versions.py
      - name: Unit test mapping
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_test_mapping.py
      - name: Translations complete and in use
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_i18n_keys.py
      - name: Permission manifest consistent with the API and the console
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_permission_manifest.py
      - name: Text file format
        if: ${{ !cancelled() }}
        run: python3 script/ci/check_file_format.py
      - name: Lint shell, Python and workflows
        if: ${{ !cancelled() }}
        run: python3 script/ci/lint_scripts.py

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Conventional commit messages
        run: >-
          python3 script/ci/check_commit_messages.py
          --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"
          --fallback "origin/${{ github.event.repository.default_branch }}"

  ci-scripts:
    name: CI script unit tests
    needs: changes
    if: needs.changes.outputs.ci_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run CI script tests
        run: bash script/ci/test_ci_scripts.sh

  # The gate: unit tests with coverage, NullAway, the enforcer rules, Checkstyle, SpotBugs, PMD and the bytecode
  # targets, once. The jobs that need it build without repeating them (GRANTFORGE_CHECKED, script/ci/maven.sh).
  java-gate:
    name: Java 21 (tests and static analysis)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test all Java modules
        id: test
        run: bash script/ci/java.sh test
      - name: Coverage thresholds
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: python3 script/ci/check_coverage.py
      - name: Check Java 17 bytecode compatibility
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: python3 script/ci/check_java_bytecode.py --max-major 61
      - name: Check Java 8 bytecode embedded in Hadoop, ZooKeeper, Hive, Kafka, HBase and YARN agents, and the Solr agent's Java 11
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: |
          python3 script/ci/check_java_bytecode.py --max-major 52 --module core/grantforge-policy-engine --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module core/grantforge-agent-core --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-zookeeper --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-hive --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-kafka --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-hbase --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-yarn --main-only
          python3 script/ci/check_java_bytecode.py --max-major 55 --module agents/grantforge-agent-solr --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-hdfs-common --main-only
          python3 script/ci/check_java_bytecode.py --max-major 52 --module agents/grantforge-agent-hdfs-native --main-only
          for hadoop in 2.7 2.10 3.2 3.3 3.4; do
            python3 script/ci/check_java_bytecode.py --max-major 52 --module "agents/grantforge-agent-hdfs-${hadoop}" --main-only
          done
      - name: Checkstyle
        if: ${{ !cancelled() }}
        run: bash script/ci/java.sh checkstyle
      - name: SpotBugs
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: bash script/ci/java.sh spotbugs
      - name: PMD
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: bash script/ci/java.sh pmd
      - name: Upload test and static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-21
          path: |
            core/**/target/surefire-reports/**
            plugins/**/target/surefire-reports/**
            agents/**/target/surefire-reports/**
            sdk/**/target/surefire-reports/**
            core/**/target/checkstyle-result.xml
            core/**/target/spotbugsXml.xml
            core/**/target/pmd.xml
            core/**/target/site/jacoco/**
            plugins/**/target/checkstyle-result.xml
            plugins/**/target/spotbugsXml.xml
            plugins/**/target/pmd.xml
            plugins/**/target/site/jacoco/**
            agents/**/target/checkstyle-result.xml
            agents/**/target/spotbugsXml.xml
            agents/**/target/pmd.xml
            agents/**/target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  # The same unit tests on the other supported JDKs; the gate already ran the static analysis.
  java:
    name: Java ${{ matrix.java }}
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(inputs.java_versions || '["17", "25", "latest"]') }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test all Java modules
        run: bash script/ci/java.sh test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-tests-${{ matrix.java }}
          path: |
            core/**/target/surefire-reports/**
            plugins/**/target/surefire-reports/**
            agents/**/target/surefire-reports/**
            sdk/**/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

  # The Trino agents read Trino's SPI, built for Java 23 from Trino 470 and for Java 25 from 479, so their modules join the
  # build only on JDK 25: their tests, coverage, bytecode and static analysis run here rather than in the gate.
  trino-agents:
    name: Trino agents (Java 25)
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the Trino agents
        id: test
        run: bash script/ci/trino_agents.sh test
      - name: Coverage thresholds
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: >-
          python3 script/ci/check_coverage.py --module agents/grantforge-agent-trino-common
          --module agents/grantforge-agent-trino-470 --module agents/grantforge-agent-trino-479
      - name: Check the Java 23 and Java 25 bytecode of the Trino lines
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: |
          python3 script/ci/check_java_bytecode.py --max-major 61 --module agents/grantforge-agent-trino-common --main-only
          python3 script/ci/check_java_bytecode.py --max-major 67 --module agents/grantforge-agent-trino-470 --main-only
          python3 script/ci/check_java_bytecode.py --max-major 69 --module agents/grantforge-agent-trino-479 --main-only
      - name: Checkstyle
        if: ${{ !cancelled() }}
        run: bash script/ci/trino_agents.sh checkstyle
      - name: SpotBugs
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: bash script/ci/trino_agents.sh spotbugs
      - name: PMD
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        run: bash script/ci/trino_agents.sh pmd
      - name: Upload test and static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trino-agents-java-25
          path: |
            agents/grantforge-agent-trino-*/target/surefire-reports/**
            agents/grantforge-agent-trino-*/target/checkstyle-result.xml
            agents/grantforge-agent-trino-*/target/spotbugsXml.xml
            agents/grantforge-agent-trino-*/target/pmd.xml
            agents/grantforge-agent-trino-*/target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend type, build and lint checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Install locked dependencies
        id: install
        run: bash script/ci/web.sh install
      - name: API types match the OpenAPI contract
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/web.sh api-check
      - name: Type check and build
        id: build
        run: bash script/ci/web.sh build
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/web.sh lint

      - name: Frontend contract tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/web.sh test
      - name: Install Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash script/ci/web.sh e2e-browsers
      - name: Browser acceptance tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash script/ci/web.sh e2e
      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-tests
          path: |
            core/grantforge-web/playwright-report/
            core/grantforge-web/test-results/
          if-no-files-found: warn
          retention-days: 14

  sdk-js:
    name: JavaScript SDK checks
    needs: changes
    if: needs.changes.outputs.sdk_js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: sdk/grantforge-js/pnpm-lock.yaml
      - name: Install locked dependencies
        id: install
        run: bash script/ci/sdk_js.sh install
      - name: Type check and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/sdk_js.sh build
      - name: ESLint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/sdk_js.sh lint
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash script/ci/sdk_js.sh test

  docs:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install locked dependencies
        run: bash script/ci/docs.sh install
      - name: Lint, type check, unit tests and content check
        run: bash script/ci/docs.sh check
      - name: Static build
        run: bash script/ci/docs.sh build

  # Integration tests only: the gate ran the unit tests and the static analysis of this commit.
  database:
    name: Database ${{ matrix.database }}
    needs: [changes, java-gate]
    if: ${{ !cancelled() && needs.changes.outputs.database == 'true' && needs.java-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTFORGE_CHECKED: '1'
    strategy:
      fail-fast: false
      matrix:
        database: ['h2', 'postgres:14', 'postgres:17', 'mysql:8.0', 'mysql:8.4', 'mariadb:10.11', 'mariadb:11.4',
                   'oracle:23', 'sqlserver:2022']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Changelog rules
        run: python3 script/ci/check_migrations.py
      - name: Integration tests
        run: bash script/ci/db_integration.sh "${{ matrix.database }}"
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-${{ strategy.job-index }}
          path: core/**/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

  plugin-api:
    name: Plugin API compatibility
    needs: [changes, java-gate]
    if: ${{ !cancelled() && needs.changes.outputs.plugin_api == 'true' && needs.java-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The check compares with the latest release tag, so it needs the history and the tags.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare the plugin API with the latest release
        run: python3 script/ci/check_plugin_api_compat.py
      - name: Upload the compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-api-compat
          path: target/plugin-api-compat/report.html
          if-no-files-found: ignore
          retention-days: 14

  # Waits for the Java gate and the console checks it builds on; it does not repeat them.
  e2e-fullstack:
    name: Full-stack acceptance (PostgreSQL)
    needs: [changes, java-gate, frontend]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.fullstack == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.java-gate.result)
      && contains(fromJSON('["success", "skipped"]'), needs.frontend.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANTFORGE_CHECKED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: core/grantforge-web/pnpm-lock.yaml
      - name: Install locked dependencies
        run: bash script/ci/web.sh install
      - name: Install Chromium
        run: bash script/ci/web.sh e2e-browsers
      - name: Package, start and test the server
        run: bash script/ci/e2e_fullstack.sh postgres
      - name: Upload full-stack reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fullstack
          path: |
            core/grantforge-web/playwright-report/fullstack/
            core/grantforge-web/test-results/fullstack/
            target/e2e-fullstack/server.log
          if-no-files-found: warn
          retention-days: 14

  # One check for branch protection: failed or cancelled jobs fail it; jobs the change did not need were skipped.
  result:
    name: CI result
    needs: [changes, hygiene, commits, ci-scripts, java-gate, java, trino-agents, frontend, sdk-js, docs, database,
            plugin-api, e2e-fullstack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          if grep -Eq '"(failure|cancelled)"' <<< "${RESULTS}"; then
            echo "::error::a CI job failed or was cancelled"
            exit 1
          fi
