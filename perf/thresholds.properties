# Upper limits of the performance benchmarks, in milliseconds: <metric>.p<percentile> or <metric>.mean.
# The authorization and API targets are those of the performance audit (a million accounts, ten thousand roles and
# a hundred thousand resources on PostgreSQL): a cached decision within 1 ms at p99, a snapshot built within 50 ms,
# list APIs within 200 ms at p95. Limits may only be tightened; loosening one needs a recorded decision.
authz.snapshot.hit.p99=1
authz.snapshot.build.p95=50
authz.snapshot.app.p95=50
api.users.page.p95=200
api.users.search.p95=200
api.groups.page.p95=200
api.roles.list.p95=200
api.me.authorization.p95=200
api.member.groups.p95=200
# The in-memory part of a snapshot in the large application: preparing the derivation and deriving twenty grants.
jmh.derivation.prepare.mean=50
jmh.derivation.derive.mean=5
