server {
    listen       9096;
    server_name  localhost;
    root /opt/app/grantforge-web;
    location / {
        try_files $uri $uri/ /index.html;
    }
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
