# GrantForge on PostgreSQL:  docker compose -f deploy/compose/postgres.yml up -d
# Change GRANTFORGE_DB_PASSWORD before using this beyond a trial.
name: grantforge-postgres

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantforge
      POSTGRES_USER: grantforge
      POSTGRES_PASSWORD: ${GRANTFORGE_DB_PASSWORD:-change-me}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantforge -d grantforge"]
      interval: 5s
      timeout: 5s
      retries: 30

  grantforge:
    image: ${GRANTFORGE_IMAGE:-grantforge:latest}
    restart: unless-stopped
    ports:
      - "${GRANTFORGE_PORT:-9999}:9999"
    volumes:
      - plugins:/opt/grantforge/plugins
    depends_on:
      database:
        condition: service_healthy
    environment:
      GRANTFORGE_DB_URL: jdbc:postgresql://database:5432/grantforge
      GRANTFORGE_DB_USER: grantforge
      GRANTFORGE_DB_PASSWORD: ${GRANTFORGE_DB_PASSWORD:-change-me}
      # Blank: a one-time token is printed in the log on first start; set one for automated installations.
      GRANTFORGE_SETUP_TOKEN: ${GRANTFORGE_SETUP_TOKEN:-}
      # Each instance of a cluster needs its own node (0-1023).
      GRANTFORGE_ID_NODE: "1"

volumes:
  database:
  plugins:
