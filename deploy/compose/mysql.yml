# GrantForge on MySQL:  docker compose -f deploy/compose/mysql.yml up -d
# MySQL Connector/J is GPL and not part of GrantForge: put mysql-connector-j-<version>.jar into
# deploy/compose/drivers (or point GRANTFORGE_DRIVERS at its folder) first.
# Change GRANTFORGE_DB_PASSWORD before using this beyond a trial.
name: grantforge-mysql

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: grantforge
      MYSQL_USER: grantforge
      MYSQL_PASSWORD: ${GRANTFORGE_DB_PASSWORD:-change-me}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u grantforge -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  grantforge:
    image: ${GRANTFORGE_IMAGE:-grantforge:latest}
    restart: unless-stopped
    ports:
      - "${GRANTFORGE_PORT:-9999}:9999"
    volumes:
      - plugins:/opt/grantforge/plugins
      - ${GRANTFORGE_DRIVERS:-./drivers}:/opt/grantforge/drivers:ro
    depends_on:
      database:
        condition: service_healthy
    environment:
      GRANTFORGE_DB_URL: jdbc:mysql://database:3306/grantforge
      GRANTFORGE_DB_USER: grantforge
      GRANTFORGE_DB_PASSWORD: ${GRANTFORGE_DB_PASSWORD:-change-me}
      # Blank: a one-time token is printed in the log on first start; set one for automated installations.
      GRANTFORGE_SETUP_TOKEN: ${GRANTFORGE_SETUP_TOKEN:-}
      # Each instance of a cluster needs its own node (0-1023).
      GRANTFORGE_ID_NODE: "1"

volumes:
  database:
  plugins:
