{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grantforge.fullname" . }}
  labels:
    {{- include "grantforge.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ .Values.database.password | b64enc | quote }}
  {{- with .Values.setupToken }}
  setup-token: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.encryptionKey }}
  encryption-key: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
