apiVersion: v1
kind: Service
metadata:
  name: {{ include "grantforge.fullname" . }}
  labels:
    {{- include "grantforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "grantforge.selectorLabels" . | nindent 4 }}
---
# The StatefulSet's governing service: stable names per replica.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grantforge.fullname" . }}-headless
  labels:
    {{- include "grantforge.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "grantforge.selectorLabels" . | nindent 4 }}
