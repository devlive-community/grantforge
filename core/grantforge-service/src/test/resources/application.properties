# Every test builds the schema from the production changelog and lets Hibernate validate it.
spring.liquibase.change-log=classpath:db/changelog/services-test-master.yaml
spring.jpa.hibernate.ddl-auto=validate
# Plugins come from the test classpath only; slow plugin calls give up quickly.
grantforge.plugins.directory=target/no-plugins-here
grantforge.plugins.call-timeout=1s
