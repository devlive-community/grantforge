databaseChangeLog:
  - changeSet:
      id: services-0001-create-gf-service
      author: grantforge
      comment: The services of a tenant whose permissions a plugin manages; configuration as JSON, secrets encrypted.
      changes:
        - createTable:
            tableName: gf_service
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gf_service
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(512)
              - column:
                  name: service_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: ${flag}
                  constraints:
                    nullable: false
              - column:
                  name: config
                  type: ${text}
                  constraints:
                    nullable: false
              - column:
                  name: secrets
                  type: ${text}
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gf_service
            columnNames: tenant_id, name
            constraintName: uk_gf_service_name
        - addForeignKeyConstraint:
            baseTableName: gf_service
            baseColumnNames: tenant_id
            referencedTableName: gf_tenant
            referencedColumnNames: id
            constraintName: fk_gf_service_tenant
