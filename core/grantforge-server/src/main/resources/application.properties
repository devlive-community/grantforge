spring.application.name=grantforge
server.port=${GRANTFORGE_SERVER_PORT:9999}
# Every log line carries the request correlation ID set by RequestIdFilter.
logging.pattern.level=%5p [%X{requestId:-}]

# Database: an embedded H2 file database by default; set GRANTFORGE_DB_URL/USER/PASSWORD for
# PostgreSQL, MySQL, MariaDB, Oracle or SQL Server. The schema is managed only by Liquibase.
spring.datasource.url=${GRANTFORGE_DB_URL:jdbc:h2:file:${GRANTFORGE_HOME:.}/data/grantforge}
spring.datasource.username=${GRANTFORGE_DB_USER:sa}
spring.datasource.password=${GRANTFORGE_DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Hibernate only checks the Liquibase schema; it never changes it.
spring.jpa.hibernate.ddl-auto=validate
# Tenants are bound before a transaction opens a session, so sessions must not span the whole request.
spring.jpa.open-in-view=false

# The API speaks JSON; without this the contract would advertise */* responses.
springdoc.default-produces-media-type=application/json

# Localised messages for API errors (resolved from Accept-Language); English when unsupported.
spring.messages.basename=i18n/messages,i18n/identity,i18n/authz,i18n/service
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=en
spring.web.locale-resolver=accept-header

# Observability: liveness/readiness probes and Prometheus metrics under /actuator. Health details are
# never exposed; every metric carries the application tag. Structured JSON logs are enabled per
# deployment with LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}
# Prometheus metrics need a signed-in session unless opened for scrapers on a trusted network.
grantforge.observability.prometheus-public=${GRANTFORGE_PROMETHEUS_PUBLIC:false}

# Console sessions (D-10): stored in the database so every node of a cluster sees them, and so sessions can be
# listed and revoked. The GRANTFORGE_SESSION cookie is HttpOnly and SameSite=Lax (SecurityConfiguration); it is
# Secure on HTTPS requests, or always with grantforge.security.cookie-secure=true (TLS ends at a proxy).
spring.session.jdbc.table-name=GF_SESSION
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${GRANTFORGE_SESSION_TIMEOUT:30m}
grantforge.security.cookie-secure=${GRANTFORGE_COOKIE_SECURE:false}
# No generated in-memory user: accounts live in the database.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# CSV imports of accounts and departments stay small (at most 1000 accounts or 5000 departments per file).
spring.servlet.multipart.max-file-size=${GRANTFORGE_UPLOAD_MAX:2MB}
spring.servlet.multipart.max-request-size=${GRANTFORGE_UPLOAD_MAX:2MB}
