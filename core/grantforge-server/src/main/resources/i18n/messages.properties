# (script/ci/check_i18n_keys.py). Arguments use MessageFormat placeholders: {0}, {1}.
error.common.bad-request=The request is invalid.
error.common.unauthenticated=Sign in to continue.
error.common.forbidden=You do not have permission to perform this action.
error.common.not-found=The requested resource does not exist.
error.common.method-not-allowed=This operation is not supported for the resource.
error.common.conflict=The request conflicts with the current state; refresh and try again.
error.common.unsupported-media-type=The request format is not supported.
error.common.internal=An unexpected error occurred. Quote the request ID when reporting it.
error.security.csrf-rejected=The page has expired. Reload it and try again.
error.security.permission-denied=You do not have permission to do this.
error.security.open-user-required=This API answers about a signed-in user; use a token issued for one.
error.security.open-scope-required=The token lacks the scope this API needs.
error.security.open-client-required=This API answers a client; use a token the client obtained for itself.
error.security.step-up-required=Enter the code of your authenticator app to confirm this operation.
error.security.mfa-setup-required=Turn on two-step sign-in in your account settings before doing this.
