# Schema of the persistence test entities, applied by MultiDatabaseIT on every supported database.
databaseChangeLog:
  - include:
      file: db/changelog/grantforge-types.yaml

  - changeSet:
      id: test-0001-create-gf-sample
      author: grantforge
      changes:
        - createTable:
            tableName: gf_sample
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gf_sample
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: ${text}(64)
                  constraints:
                    nullable: false

  - changeSet:
      id: test-0002-create-gf-tenant-sample
      author: grantforge
      changes:
        - createTable:
            tableName: gf_tenant_sample
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gf_tenant_sample
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: ${text}(64)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: gf_tenant_sample
            indexName: ix_gf_tenant_sample_tenant
            columns:
              - column:
                  name: tenant_id
