# Schema of the persistence test entities, applied by MultiDatabaseIT on every supported database.
# It doubles as the reference for portable column types used by production changelogs.
databaseChangeLog:
  # Unicode text: NVARCHAR on SQL Server (VARCHAR is not Unicode there) and Oracle (NVARCHAR2 always uses
  # character-length semantics); VARCHAR elsewhere (MySQL NVARCHAR is 3-byte utf8 and cannot store emoji).
  - property:
      name: text
      value: NVARCHAR
      dbms: mssql, oracle
  - property:
      name: text
      value: VARCHAR
      dbms: h2, mysql, mariadb, postgresql
  # Microsecond UTC timestamps: DATETIME(6) on MySQL/MariaDB (TIMESTAMP ends in 2038 there),
  # DATETIME2(6) on SQL Server, TIMESTAMP(6) elsewhere.
  - property:
      name: instant
      value: DATETIME(6)
      dbms: mysql, mariadb
  - property:
      name: instant
      value: DATETIME2(6)
      dbms: mssql
  - property:
      name: instant
      value: TIMESTAMP(6)
      dbms: h2, oracle, postgresql

  - changeSet:
      id: test-0001-create-gf-sample
      author: grantforge
      changes:
        - createTable:
            tableName: gf_sample
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gf_sample
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: ${text}(64)
                  constraints:
                    nullable: false

  - changeSet:
      id: test-0002-create-gf-tenant-sample
      author: grantforge
      changes:
        - createTable:
            tableName: gf_tenant_sample
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gf_tenant_sample
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: ${text}(64)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: gf_tenant_sample
            indexName: ix_gf_tenant_sample_tenant
            columns:
              - column:
                  name: tenant_id
