# Identity messages (English, default). Every key must also exist in identity_zh_CN.properties.
error.identity.setup-completed=Setup has already been completed.
error.identity.setup-token-invalid=The setup token is not valid. Use the token printed in the latest server log.
error.identity.password-too-short=The password must have at least {0} characters.
error.identity.password-too-long=The password must have at most {0} characters.
error.identity.password-contains-username=The password must not contain the user name.
error.identity.password-too-simple=The password must mix at least {0} of: lowercase letters, uppercase letters, digits and other characters.
