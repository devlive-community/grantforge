                    primaryKeyName: pk_gf_password_history
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: gf_password_history
            indexName: ix_gf_password_history_account
            columns:
              - column:
                  name: account_id
              - column:
                  name: created_at
        - addForeignKeyConstraint:
            baseTableName: gf_password_history
            baseColumnNames: account_id
            referencedTableName: gf_user_account
            referencedColumnNames: id
            constraintName: fk_gf_password_history_account
            onDelete: CASCADE

  - changeSet:
