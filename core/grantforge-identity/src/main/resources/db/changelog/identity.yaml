                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: session_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: client_ip
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: ${text}(255)
              - column:
                  name: signed_in_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: last_seen_at
                  type: ${instant}
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gf_console_session
            columnNames: session_id
            constraintName: uk_gf_console_session_sid
        - createIndex:
            tableName: gf_console_session
            indexName: ix_gf_console_session_seen
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: last_seen_at
        - createIndex:
            tableName: gf_console_session
            indexName: ix_gf_console_session_account
            columns:
              - column:
                  name: account_id
        - addForeignKeyConstraint:
            baseTableName: gf_console_session
            baseColumnNames: account_id
            referencedTableName: gf_user_account
            referencedColumnNames: id
            constraintName: fk_gf_console_session_account
            onDelete: CASCADE

  - changeSet:
      id: identity-0006-add-gf-tenant-platform
      author: grantforge
      comment: The tenant first-run setup created (always code "default") hosts the platform administrators.
      changes:
        - addColumn:
            tableName: gf_tenant
            columns:
              - column:
                  name: platform
                  type: ${flag}
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - update:
            tableName: gf_tenant
            columns:
              - column:
                  name: platform
                  valueBoolean: true
            where: code = 'default'

  - changeSet:
      id: identity-0007-create-gf-org-unit
      author: grantforge
      comment: Departments as a materialized path (D-35).
      changes:
        - createTable:
            tableName: gf_org_unit
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_gf_org_unit
                    nullable: false
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: ${text}(128)
                  constraints:
                    nullable: false
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: path
                  type: VARCHAR(400)
                  constraints:
                    nullable: false
              - column:
                  name: depth
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gf_org_unit
            columnNames: tenant_id, code
            constraintName: uk_gf_org_unit_code
        - createIndex:
            tableName: gf_org_unit
            indexName: ix_gf_org_unit_path
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: path
        - createIndex:
            tableName: gf_org_unit
            indexName: ix_gf_org_unit_parent
            columns:
              - column:
                  name: parent_id
        - addForeignKeyConstraint:
            baseTableName: gf_org_unit
            baseColumnNames: parent_id
            referencedTableName: gf_org_unit
            referencedColumnNames: id
            constraintName: fk_gf_org_unit_parent
        - addForeignKeyConstraint:
            baseTableName: gf_org_unit
            baseColumnNames: tenant_id
            referencedTableName: gf_tenant
            referencedColumnNames: id
            constraintName: fk_gf_org_unit_tenant

