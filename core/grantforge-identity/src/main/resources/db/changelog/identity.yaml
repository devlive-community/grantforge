                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: external_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gf_external_identity
            columnNames: account_id
            constraintName: uk_gf_external_identity_account
        - addUniqueConstraint:
            tableName: gf_external_identity
            columnNames: source_id, external_id
            constraintName: uk_gf_external_identity_subject
        - addForeignKeyConstraint:
            baseTableName: gf_external_identity
            baseColumnNames: account_id
            referencedTableName: gf_user_account
            referencedColumnNames: id
            constraintName: fk_gf_external_identity_account
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: gf_external_identity
            baseColumnNames: source_id
            referencedTableName: gf_identity_source
            referencedColumnNames: id
            constraintName: fk_gf_external_identity_source
  - changeSet:
      id: identity-0013-index-gf-user-account-created
      author: grantforge
      comment: The account list pages newest first; without this index every page sorts the whole tenant (D-86).
      changes:
        - createIndex:
            tableName: gf_user_account
            indexName: ix_gf_user_account_created
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: created_at
              - column:
                  name: id
  - changeSet:
      id: identity-0014-enable-pg-trgm
      author: grantforge
      dbms: postgresql
      # Trigram indexes make the account search's "contains" match fast on PostgreSQL (D-87). Trusted from PostgreSQL 13
      # on, so the database owner may enable it; where that is refused the search scans as on the other databases.
      failOnError: false
      comment: Enables pg_trgm for the account search where the database allows it (D-87)
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm
  - changeSet:
      id: identity-0015-trigram-gf-user-account
      author: grantforge
      dbms: postgresql
      # Retried at every start until pg_trgm is there, so enabling it later still brings the indexes.
      preConditions:
        - onFail: CONTINUE
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM pg_extension WHERE extname = 'pg_trgm'
      comment: The account search matches login names, display names and addresses that contain the text (D-87)
      changes:
        - sql:
            sql: CREATE INDEX ix_gf_user_account_uname_trgm ON gf_user_account USING gin (username_norm gin_trgm_ops)
        - sql:
            sql: CREATE INDEX ix_gf_user_account_dname_trgm ON gf_user_account USING gin (LOWER(display_name) gin_trgm_ops)
        - sql:
            sql: CREATE INDEX ix_gf_user_account_email_trgm ON gf_user_account USING gin (LOWER(email) gin_trgm_ops)
