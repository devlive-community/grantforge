# Organization data sources, independent of login providers.
databaseChangeLog:
  - changeSet:
      id: datasource-0001-organization-directory
      author: grantforge
      changes:
        - createTable:
            tableName: gf_data_source
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_gf_data_source
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: ${text}(128)
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: identity_source_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: ${flag}
                  constraints:
                    nullable: false
              - column:
                  name: login_updates
                  type: ${flag}
                  constraints:
                    nullable: false
              - column:
                  name: settings
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: parent_unit_id
                  type: BIGINT
              - column:
                  name: secret
                  type: VARCHAR(1024)
              - column:
                  name: sync_interval_minutes
                  type: INT
              - column:
                  name: last_synced_at
                  type: ${instant}
              - column:
                  name: last_sync_summary
                  type: ${text}(512)
              - column:
                  name: directory_scope
                  type: VARCHAR(64)
              - column:
                  name: sync_lease
                  type: VARCHAR(36)
              - column:
                  name: sync_lease_until
                  type: ${instant}
        - addUniqueConstraint:
            tableName: gf_data_source
            columnNames: tenant_id, code
            constraintName: uk_gf_data_source_code
        - addUniqueConstraint:
            tableName: gf_data_source
            columnNames: identity_source_id
            constraintName: uk_gf_data_source_identity
        - createTable:
            tableName: gf_directory_department
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_gf_directory_department
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: external_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: org_unit_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gf_directory_department
            columnNames: source_id, external_id
            constraintName: uk_gf_dir_dept_external
        - addUniqueConstraint:
            tableName: gf_directory_department
            columnNames: org_unit_id
            constraintName: uk_gf_dir_dept_unit
        - addForeignKeyConstraint:
            baseTableName: gf_directory_department
            baseColumnNames: org_unit_id
            referencedTableName: gf_org_unit
            referencedColumnNames: id
            constraintName: fk_gf_dir_dept_unit
        - createTable:
            tableName: gf_directory_employee
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_gf_directory_employee
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(254)
              - column:
                  name: department_ids
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: present_in_directory
                  type: ${flag}
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: gf_directory_employee
            columnNames: source_id, user_id
            constraintName: uk_gf_dir_employee_external
        - createTable:
            tableName: gf_directory_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_gf_directory_account
              - column:
                  name: tenant_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${instant}
                  constraints:
                    nullable: false
              - column:
                  name: source_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trusted_email
                  type: VARCHAR(254)
              - column:
                  name: employee_id
                  type: VARCHAR(255)
        - addUniqueConstraint:
            tableName: gf_directory_account
            columnNames: source_id, account_id
            constraintName: uk_gf_dir_account_local
        - addForeignKeyConstraint:
            baseTableName: gf_directory_account
            baseColumnNames: account_id
            referencedTableName: gf_user_account
            referencedColumnNames: id
            constraintName: fk_gf_dir_account_local
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: gf_data_source
            baseColumnNames: tenant_id
            referencedTableName: gf_tenant
            referencedColumnNames: id
            constraintName: fk_gf_ds_source_tenant
        - addForeignKeyConstraint:
            baseTableName: gf_directory_department
            baseColumnNames: tenant_id
            referencedTableName: gf_tenant
            referencedColumnNames: id
            constraintName: fk_gf_ds_dept_tenant
        - addForeignKeyConstraint:
            baseTableName: gf_directory_department
            baseColumnNames: source_id
            referencedTableName: gf_data_source
            referencedColumnNames: id
            constraintName: fk_gf_dir_dept_source
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: gf_directory_employee
            baseColumnNames: tenant_id
            referencedTableName: gf_tenant
            referencedColumnNames: id
            constraintName: fk_gf_ds_employee_tenant
        - addForeignKeyConstraint:
            baseTableName: gf_directory_employee
            baseColumnNames: source_id
            referencedTableName: gf_data_source
            referencedColumnNames: id
            constraintName: fk_gf_dir_employee_source
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: gf_directory_account
            baseColumnNames: tenant_id
            referencedTableName: gf_tenant
            referencedColumnNames: id
            constraintName: fk_gf_ds_account_tenant
        - addForeignKeyConstraint:
            baseTableName: gf_directory_account
            baseColumnNames: source_id
            referencedTableName: gf_data_source
            referencedColumnNames: id
            constraintName: fk_gf_dir_account_source
            onDelete: CASCADE
        - createIndex:
            tableName: gf_directory_account
            indexName: ix_gf_dir_account_email
            columns:
              - column:
                  name: source_id
              - column:
                  name: trusted_email
        - createIndex:
            tableName: gf_directory_employee
            indexName: ix_gf_dir_employee_email
            columns:
              - column:
                  name: source_id
              - column:
                  name: email

  # SQL Server treats NULL as a unique value, so use a filtered index for pending unbound accounts.
  - changeSet:
      id: datasource-0002-account-employee-unique
      author: grantforge
      dbms: '!mssql'
      changes:
        - addUniqueConstraint:
            tableName: gf_directory_account
            columnNames: source_id, employee_id
            constraintName: uk_gf_dir_account_employee
  - changeSet:
      id: datasource-0002-account-employee-unique-mssql
      author: grantforge
      dbms: mssql
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX uk_gf_dir_account_employee ON gf_directory_account (source_id, employee_id) WHERE employee_id IS NOT NULL
