# Authorization messages (English, default). Every key must also exist in authz_zh_CN.properties.
error.authz.application-code-taken=The application code "{0}" is already in use.
error.authz.application-protected=Applications that are part of GrantForge cannot be deleted.
error.authz.application-not-empty=Delete the application's resources first.
error.authz.resource-code-taken=The resource code "{0}" is already used in this application.
