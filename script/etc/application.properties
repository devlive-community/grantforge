# External configuration loaded by script/bin/startup.sh (--spring.config.location).
server.port=${GRANTFORGE_SERVER_PORT:9999}

# Database (defaults to an embedded H2 file database under ./data). Examples:
#   PostgreSQL: GRANTFORGE_DB_URL=jdbc:postgresql://host:5432/grantforge
#   MariaDB:    GRANTFORGE_DB_URL=jdbc:mariadb://host:3306/grantforge
#   MySQL:      GRANTFORGE_DB_URL=jdbc:mysql://host:3306/grantforge  (put mysql-connector-j into drivers/ first)
#   Oracle:     GRANTFORGE_DB_URL=jdbc:oracle:thin:@//host:1521/FREEPDB1
#   SQL Server: GRANTFORGE_DB_URL=jdbc:sqlserver://host:1433;databaseName=grantforge;encrypt=true
# with GRANTFORGE_DB_USER and GRANTFORGE_DB_PASSWORD. Each instance of a cluster needs its own
# GRANTFORGE_ID_NODE (0-1023).

# Observability: probes at /actuator/health/liveness and /actuator/health/readiness, metrics at
# /actuator/prometheus. Set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash) for JSON logs.

# Logging: besides the console, write logs/grantforge.log (rolled at 10 MB, 7 files kept). The first-run setup
# token is printed there.
logging.file.name=${GRANTFORGE_LOG_FILE:logs/grantforge.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
